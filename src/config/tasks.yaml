detect_ingredients_task:
  description: >
    Analyze the uploaded pantry images ({image_paths}) and manual input notes ({manual_input}).
    Use the vision and extraction tools to detect all food items, vegetables, spices, meats, and condiments.
    Produce a clean, de-duplicated list of available ingredients.
  expected_output: >
    A comprehensive, de-duplicated comma-separated list of identified ingredients.
  agent: ingredient_detection_agent

filter_dietary_task:
  description: >
    Ingredients typed by the user: {manual_input}
    If a previous task detected ingredients in the user's photos, use that list instead (it already includes the typed ones).
    Review the ingredients against the user's dietary restrictions: {dietary_restrictions}.
    Filter out non-compliant items (e.g., gluten sources like semolina/couscous/malsouka/frik if gluten-free; meats if vegetarian/vegan).
    Flag high-sodium or problematic items if relevant.
  expected_output: >
    A validated list of compliant ingredients available for recipe preparation, noting any excluded ingredients.
  agent: dietary_filtering_agent

suggest_heritage_recipe_task:
  description: >
    User preferences: {meal_preference}
    Dietary restrictions: {dietary_restrictions}
    Did the user provide ingredients: {has_pantry}
    If yes, the compliant ingredients they have are given in the context.

    Dish requested by the user: {selected_dish}

    Reference recipe for the requested dish, taken from the heritage database:
    {heritage_recipe}

    If a dish is requested (anything other than "None"), prepare exactly that dish.
    Base it on the reference recipe above and do not switch to another dish.
    If the reference recipe is "None", call `search_tunisian_recipes_tool` with the dish name to find it.
    Use the available pantry ingredients where they fit and list everything else as add-ons.
    If the dish conflicts with the dietary restrictions, adapt it and say what you changed.

    If no dish is requested, use the `search_tunisian_recipes_tool` to query the historical database
    of authentic Tunisian recipes and select the best-matching heritage dish.

    Keep the vernacular name (e.g., Kousksi bil Quarnit, Rouz Jerbi, Kafteji) and name the traditional techniques
    (taklia, couscoussier steaming, spice balance) inside the steps, following your lexicon rules.

    Recipe style chosen by the user: {recipe_style}

    If the style is "classic": base the recipe strictly on the heritage database (the reference recipe above or the
    search tool). Do not search the web.

    If the style is "chefs_variants" or "comparison", this step is mandatory before you write anything:
    call the "Search the internet with Serper" tool, at most twice, to find how a modern Tunisian chef or creator
    prepares this dish. Good queries are "<dish name> Teyssir Ksouri" (Chef Teyssir Ksouri, also spelled Taysir)
    and "<dish name> recette chef tunisien" or "<dish name> Hindati". Any Tunisian chef or creator named in the
    results counts. Attribute to a chef only the details found in a result that names that chef, and give that
    result's link. Never combine details from different results into one chef's version. If the result naming
    the chef gives no recipe details, say only that the chef has a version, with the link.
    - chefs_variants: write that chef's version of the dish. Name the chef in the context sentence and keep the
      specifics the results mention (marinade, tour de main, taklia). If the results name no chef or give no usable
      detail, write one short line saying no modern chef version was found, then the classic recipe.
    - comparison: write the classic heritage recipe, then always end with a section titled "Modern chef's take"
      (in French: "La version du chef moderne"): at most 4 bullets on how the named chef adjusts the dish, with the
      source link. This section is 120 words at most and does not count toward the 350-word limit. If the results
      name no chef or give no usable detail, keep the section and say so in one line.
    If the style is not classic but no web search tool is available to you, write the classic recipe.

    Format it as a compact recipe card read on a screen, 350 words at most:
    - The dish name as a heading, then one sentence of heritage context.
    - One line with servings, prep time and cook time.
    - Ingredients as short bullets with quantities. If the user provided ingredients, split them into two groups;
      otherwise give one single list. Group titles:
      when writing in English, "You already have" and "To add", or "Ingredients" for a single list;
      when writing in French, "Déjà dans votre cuisine" and "À ajouter", or "Ingrédients" for a single list.
    - Steps as a numbered list, one or two short sentences each, 10 steps at most.
    - At most 2 chef tips, one line each. If you adapted the dish to the dietary restrictions, say so in one line.
    No introduction, no conclusion, no repeated information, no general advice beyond what is asked.

    Write the whole answer in {language}, including headings. Keep Tunisian dish names in their vernacular form.
    Start directly with the content: no preamble, no comments about these instructions. Do not use emoji or pictographic symbols such as ✓, ✅, ⚠️ or ❌; write "yes", "no" or "warning" in words instead.
  expected_output: >
    A compact recipe card of 350 words at most: dish name, one-sentence context, servings and times,
    ingredients split into pantry and add-ons, numbered steps, up to 2 tips. In chefs_variants style the recipe
    is the named chef's version; in comparison style it ends with a short "Modern chef's take" section.
  agent: recipe_suggestion_agent

source_ingredients_task:
  description: >
    Review all ingredients and add-ons required by the suggested recipe.
    For city: {target_city} (e.g., Ottawa/Gatineau or Montreal), identify items requiring special sourcing 
    (tabel, harissa arbi, semoule grain moyen, fresh seafood, specific cuts of lamb or beef).
    Provide exact specialty grocers (e.g., Jasmine Market, Mid-East Food Centre, Marché Adonis) and immediate supermarket equivalents.

    Format it as a practical shopping list read on a screen, 250 words at most:
    - One markdown table with the columns: ingredient, where to buy it in {target_city}, supermarket substitute.
      List only what the user has to buy: skip every ingredient the recipe says the user already has,
      and skip salt, water, oil and other basic staples.
    - Then at most 3 recommended stores, one line each in {language}: name, neighborhood, what to buy there.
    No introduction, no conclusion, no repeated information, no general advice beyond what is asked.

    Write the whole answer in {language}, including headings. Keep Tunisian dish names in their vernacular form.
    Start directly with the content: no preamble, no comments about these instructions. Do not use emoji or pictographic symbols such as ✓, ✅, ⚠️ or ❌; write "yes", "no" or "warning" in words instead.
  expected_output: >
    A shopping list of 250 words at most: one table (ingredient, specialty store in {target_city}, supermarket substitute)
    and up to 3 one-line store recommendations.
  agent: ingredient_sourcing_agent

analyze_nutrition_task:
  description: >
    Analyze the final recipe provided by the chef.
    Dietary profile: {dietary_restrictions}
    Estimate portion size, total caloric intake, macronutrient breakdown (proteins, carbohydrates, fats, fiber, sodium).
    Account for cooking techniques (olive oil usage, taghmis dipping habits).
    Deliver actionable dietary tips to balance blood sugar and optimize metabolic health without ruining authenticity.

    Format it as a focused nutrition panel read on a screen, 250 words at most:
    - One line with the portion size and number of servings.
    - One markdown table per serving: calories, protein, carbohydrates, fat, fiber, sodium.
    - Up to 3 short bullets on the key health points for this dietary profile.
    - Up to 3 short, actionable tips.
    No ingredient-by-ingredient breakdown and no alternative scenarios.
    No introduction, no conclusion, no repeated information, no general advice beyond what is asked.

    Write the whole answer in {language}, including headings. Keep Tunisian dish names in their vernacular form.
    Start directly with the content: no preamble, no comments about these instructions. Do not use emoji or pictographic symbols such as ✓, ✅, ⚠️ or ❌; write "yes", "no" or "warning" in words instead.
  expected_output: >
    A nutrition panel of 250 words at most: portion line, one table of per-serving metrics
    (calories, protein, carbohydrates, fat, fiber, sodium), up to 3 health points and up to 3 tips.
  agent: nutrient_analysis_agent

analyze_meal_task:
  description: >
    Estimate the nutritional value of the user's meal (analysis-only mode, no recipe is generated).

    Dish selected by the user: {selected_dish}

    Reference recipe for that dish, taken from the heritage database:
    {heritage_recipe}

    Dietary profile: {dietary_restrictions}

    Ingredients typed by the user: {manual_input}
    If a previous task is present, its output is the list of ingredients detected in the user's photos (it already includes the typed ones).

    If a dish is selected (anything other than "None"), analyze one standard serving of it, using the reference recipe when available.
    Otherwise, treat the detected ingredients as a single meal and estimate realistic portions.
    If there is neither a selected dish nor any detected ingredient, say so plainly and do not invent a meal.

    Estimate portion size, total caloric intake, macronutrient breakdown (proteins, carbohydrates, fats, fiber, sodium).
    Account for cooking techniques (olive oil usage, taghmis dipping habits).
    Give practical advice suited to the dietary profile, without ruining authenticity.

    Format it as a focused nutrition panel read on a screen, 250 words at most:
    - One line naming the analyzed meal and the portion size.
    - One markdown table per serving: calories, protein, carbohydrates, fat, fiber, sodium.
    - Up to 3 short bullets on the key health points for this dietary profile.
    - Up to 3 short, actionable tips.
    No ingredient-by-ingredient breakdown and no alternative scenarios.
    No introduction, no conclusion, no repeated information, no general advice beyond what is asked.

    Write the whole answer in {language}, including headings. Keep Tunisian dish names in their vernacular form.
    Start directly with the content: no preamble, no comments about these instructions. Do not use emoji or pictographic symbols such as ✓, ✅, ⚠️ or ❌; write "yes", "no" or "warning" in words instead.
  expected_output: >
    A nutrition panel of 250 words at most: meal and portion line, one table of per-serving metrics
    (calories, protein, carbohydrates, fat, fiber, sodium), up to 3 health points and up to 3 tips.
  agent: nutrient_analysis_agent
